name: Pinterest - configurar y sincronizar

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué quieres hacer"
        required: true
        type: choice
        options:
          - probar
          - listar_tableros
          - historico
        default: probar
      max_pins:
        description: "Solo para histórico: máximo de Pins nuevos (0 = todos)"
        required: true
        default: "0"

concurrency:
  group: ecos-del-alma-pinterest
  cancel-in-progress: false

jobs:
  pinterest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar acción de Pinterest
        id: pinterest
        continue-on-error: true
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ${{ vars.PINTEREST_BOARD_NAME }}
          PINTEREST_SITE_URL: https://faridsprado.github.io/procedural-writing-system
          PINTEREST_AI_DISCLOSURE: "true"
        run: |
          case "${{ inputs.accion }}" in
            probar)
              python utils/publish_pinterest.py --test-pin
              ;;
            listar_tableros)
              python utils/publish_pinterest.py --list-boards
              ;;
            historico)
              python utils/publish_pinterest.py --limit "${{ inputs.max_pins }}"
              ;;
            *)
              echo "Acción no válida"
              exit 1
              ;;
          esac

      - name: Guardar estado del histórico
        if: always()
        run: |
          git config --global user.name "Ecos del Alma Bot"
          git config --global user.email "bot@ecosdelalma.local"
          git add memoria/pinterest_publicados.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar estado de Pinterest"
            git push
          fi

      - name: Marcar error de Pinterest
        if: steps.pinterest.outcome == 'failure'
        run: |
          echo "La operación de Pinterest falló. Revisa el paso 'Ejecutar acción de Pinterest'."
          exit 1
